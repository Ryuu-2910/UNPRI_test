<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="output.css" rel="stylesheet">
        <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
        />
        <title>Document UNPRI</title>
    </head>
    <body>
        <!-- The outer container holds the background color -->
<section class="w-full">
    <!-- The PNG background image sits on top with object-cover -->
    <div class="w-full relative">
        <div class=" bg-linear-to-b from-[#320D52] via-black to-white h-[] inline-block opacity-90">
            <img src="background.png" alt="UNPRI Background" class="w-full h-auto object-cover opacity-90 block">
        </div>
    </div>
    <div>    
        <!-- Content overlaid on top -->
        <div class="flex absolute inset-0 max-w-3xl justify-start mt-120">
            <div class="w-auto h-10">
                <h5 class="text-gray-500">Sejarah UNPRI</h5>
                <h1 class="">Ringkasan Singkat Universitas Prima Indonesia (UNPRI)</h1>
            </div>
        </div>
    </div>
</section>
    </body>
</html>
